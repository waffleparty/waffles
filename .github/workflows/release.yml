name: Release

# On every push to main: validate (ci.yml), then semantic-release reads the conventional commits since the last tag.
# When they call for a release (feat, fix, perf, revert, or a breaking change), it writes the version into every
# manifest listed in .version-bump.json (scripts/bump-version.sh), commits them to main as
# "chore(release): X.Y.Z [skip ci]", tags that commit X.Y.Z (no "v"), and creates the GitHub release. Then the npm
# job publishes @waffleparty/waffles from the new tag, and a pull request on waffleparty/marketplace moves the waffles
# entry's ref to the new tag.
on:
  push:
    branches: [main]

# One run at a time, so 2 runs cannot pick the same version or race on the release commit.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  release:
    name: Semantic release
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag
      issues: write # @semantic-release/github
      pull-requests: write # @semantic-release/github
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The successCmd in .releaserc.json writes .release-version, only when a release was made.
      - name: Read released version
        id: version
        run: |
          if [[ -f .release-version ]]; then
            echo "version=$(cat .release-version)" >>"$GITHUB_OUTPUT"
          fi

  npm:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    # Trusted publishing: npm takes this workflow's OIDC token in place of a token secret. The package's trusted
    # publisher on npmjs.com must name waffleparty/waffles and this file, release.yml.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install latest npm
        run: npm i -g npm@latest && npm --version
      # Publishing must not tolerate a missing or stale lockfile.
      - run: npm ci
      # Compiles the package into dist/ (scripts/build-npm.ts), with the version of the release tag's manifests.
      - name: Build the package
        run: npm run build:npm
      # The empty token and user config keep npm off the .npmrc that setup-node writes, so it publishes with OIDC.
      - name: Publish with npm
        working-directory: dist
        run: npm_config_loglevel=verbose npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_USERCONFIG: ''

  marketplace:
    name: Update marketplace
    needs: release
    # Needs a waffleparty GitHub App with contents and pull-requests write on waffleparty/marketplace: repository
    # variable MARKETPLACE_APP_ID and secret MARKETPLACE_APP_PRIVATE_KEY. This job is skipped until they exist.
    if: needs.release.outputs.version != '' && vars.MARKETPLACE_APP_ID != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3.4.0
        id: token
        with:
          app-id: ${{ vars.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          owner: waffleparty
          repositories: marketplace
      - uses: actions/checkout@v7.0.1
        with:
          repository: waffleparty/marketplace
          token: ${{ steps.token.outputs.token }}
      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          branch="waffles-${VERSION}"
          file=.claude-plugin/marketplace.json
          tmp="$(mktemp)"
          jq --arg v "${VERSION}" \
            '(.plugins[] | select(.name == "waffles")) |= (.version = $v | .source.ref = $v)' \
            "${file}" >"${tmp}"
          cat "${tmp}" >"${file}"
          git config user.name "waffleparty-release[bot]"
          git config user.email "360843544+waffleparty-release[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "feat: waffles ${VERSION}"
          git push origin "${branch}"
          gh pr create \
            --title "feat: waffles ${VERSION}" \
            --body "Moves the waffles entry to release [${VERSION}](https://github.com/waffleparty/waffles/releases/tag/${VERSION})."
