name: CI

# Runs on pull requests, and from release.yml before each release.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # jq (used by scripts/bump-version.sh) and pipx are preinstalled on ubuntu-latest.
      - name: Run pre-commit
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure
