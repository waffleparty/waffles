name: CI

# Runs on pull requests, and from release.yml before each release.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # jq (used by scripts/bump-version.sh) and pipx are preinstalled on ubuntu-latest.
      - name: Run pre-commit
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    env:
      # The Claude Code version that validates the manifests and runs the hook tests.
      CLAUDE_CODE: "@anthropic-ai/claude-code@2.1.332"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: Validate the plugin
        run: npx --yes "$CLAUDE_CODE" plugin validate .
      # Runs every hooks/**/*.test.ts(x) in Claude Code's hook environment.
      - name: Test the hooks
        run: npx --yes "$CLAUDE_CODE" plugin test
      # The core, the adapters that run on plain Node.js, and the scripts: the type check, then their tests.
      - name: Install the development tools
        run: npm ci
      - name: Type-check the core, the adapters, and the scripts
        run: npm run typecheck
      - name: Test on Node.js
        run: npm run test:node
